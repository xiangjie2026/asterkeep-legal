<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Timoori — Legal</title>
<style>
  :root { --canvas:#FFF8F2; --surface:#FFFFFF; --ink:#202A49; --ink-soft:#5A6076; --border:#EADFD6; --accent-ink:#6D55B8; --accent-soft:#EDE7FB; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--canvas); color:var(--ink); font:16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; }
  .wrap { max-width:640px; margin:0 auto; padding:64px 24px; }
  .mark { width:48px; height:48px; border-radius:14px; background:var(--accent-soft); color:var(--accent-ink); display:grid; place-items:center; font-weight:700; font-size:21px; margin-bottom:20px; }
  h1 { font-size:30px; margin:0 0 8px; letter-spacing:-.3px; }
  p.lead { color:var(--ink-soft); margin:0 0 32px; }
  a.card { display:block; background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:20px 22px; margin:0 0 14px; color:var(--ink); text-decoration:none; }
  a.card:hover { border-color:var(--accent-ink); }
  a.card strong { display:block; font-size:17px; }
  a.card span { color:var(--ink-soft); font-size:14px; }
  footer { border-top:1px solid var(--border); margin-top:44px; padding-top:18px; color:var(--ink-soft); font-size:13px; }
  @media (prefers-color-scheme: dark) {
    :root { --canvas:#14161D; --surface:#1C1F28; --ink:#F2F3F7; --ink-soft:#B9BECC; --border:#2E3341; --accent-ink:#B9A6EF; --accent-soft:#332C4A; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="mark" aria-hidden="true">T</div>
  <h1>Timoori</h1>
  <p class="lead">Legal and support information.</p>
  <a class="card" href="privacy.html"><strong>Privacy Policy</strong><span>English · 简体中文</span></a>
  <a class="card" href="support.html"><strong>Support</strong><span>FAQ, limits and contact</span></a>
  <footer>Timoori · Effective date: 2026-11-14 · <a href="mailto:styr12@163.com">styr12@163.com</a></footer>
</div>
</body>
</html>
